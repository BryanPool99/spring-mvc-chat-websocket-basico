<!DOCTYPE html>
<html>
<head>
    <title>Chat en tiempo real</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <style>
        body { background-color: #f0f2f5; }
        #chat-box {
            height: 500px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 15px;
            background: #fff;
        }
        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            display: inline-block;
            clear: both;
        }
        .message.me {
            background-color: #0d6efd;
            color: #fff;
            float: right;
            text-align: right;
        }
        .message.other {
            background-color: #e9ecef;
            color: #212529;
            float: left;
            text-align: left;
        }
        .sender {
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .timestamp {
            font-size: 0.75rem;
            color: #6c757d;
            margin-top: 3px;
        }
        .timestamp {
            font-size: 0.75rem;
            margin-top: 3px;
        }

        .message.me .timestamp {
            color: #e9ecef; /* gris claro para que contraste sobre azul */
            text-align: right;
        }

        .message.other .timestamp {
            color: #6c757d; /* gris oscuro sobre fondo claro */
            text-align: left;
        }

    </style>
</head>
<body class="container py-4">
<h2 class="mb-4 text-center">💬 Chat Profesional</h2>

<div class="row mb-3">
    <div class="col-md-4">
        <input id="from" class="form-control" placeholder="Tu nombre">
    </div>
    <div class="col-md-8 d-flex">
        <input id="text" class="form-control me-2" placeholder="Escribe tu mensaje...">
        <button id="sendBtn" class="btn btn-primary" onclick="sendMessage()" disabled>Enviar</button>
    </div>
</div>

<div id="chat-box"></div>

<script>
    var socket = new SockJS('/chat-websocket');
    var stompClient = Stomp.over(socket);
    var currentUser = "";

    // Conectar primero
    stompClient.connect({}, function(frame) {
        console.log("Conectado: " + frame);
        document.getElementById("sendBtn").disabled = false; // habilitar botón

        // Suscribirse SOLO después de estar conectado
        stompClient.subscribe('/topic/messages', function(messageOutput) {
            var message = JSON.parse(messageOutput.body);
            var div = document.createElement("div");
            div.classList.add("message");

            if (message.from === currentUser) {
                div.classList.add("me");
            } else {
                div.classList.add("other");
                var sender = document.createElement("div");
                sender.classList.add("sender");
                sender.textContent = message.from;
                div.appendChild(sender);
            }

            var textNode = document.createElement("div");
            textNode.textContent = message.text;
            div.appendChild(textNode);

            // Timestamp
            var timeNode = document.createElement("div");
            timeNode.classList.add("timestamp");
            timeNode.textContent = new Date(message.timestamp)
                .toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            div.appendChild(timeNode);


            document.getElementById("chat-box").appendChild(div);
            document.getElementById("chat-box").scrollTop = document.getElementById("chat-box").scrollHeight;
        });
    });

    function sendMessage() {
        if (!stompClient || !stompClient.connected) {
            alert("La conexión aún no está lista. Espera un momento.");
            return;
        }

        currentUser = document.getElementById("from").value;
        var text = document.getElementById("text").value;

        stompClient.send("/app/sendMessage", {}, JSON.stringify({
            'from': currentUser,
            'text': text
        }));

        document.getElementById("text").value = "";
    }
</script>
</body>
</html>
